<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Booking - BayFlow Auto Repair</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Top Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="px-3 py-1 bg-blue-600 text-white text-xs font-bold rounded-lg">BayFlow</span>
            <h1 class="text-xl font-bold text-white tracking-wide">Customer Booking Portal</h1>
        </div>
        <div>
            <a href="dashboard.html" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-semibold rounded-lg border border-slate-600 transition flex items-center gap-2">
                <span>📊</span> Back to Dashboard
            </a>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Column: Add Repair Order Form -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl h-fit">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <span>🚗</span> New Job Card / Repair Order
            </h2>
            
            <div id="orderMsg" class="mb-4 text-xs font-medium text-center"></div>

            <form id="orderForm" onsubmit="createRepairOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Select Shop</label>
                    <select id="shopId" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500">
                        <option value="1">Lahore Auto Care</option>
                        <option value="2">Islamabad Motors</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Customer Name</label>
                    <input type="text" id="custName" required placeholder="e.g. Ali Hussain" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Vehicle Number / Model</label>
                    <input type="text" id="vehModel" required placeholder="e.g. Honda Civic - LE-1234" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Problem Description / Service</label>
                    <textarea id="probDesc" rows="3" required placeholder="e.g. Engine oil change & brake pads replacement" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Initial Status</label>
                    <select id="orderStatus" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500">
                        <option value="PENDING">Pending</option>
                        <option value="CONFIRMED">Confirmed</option>
                        <option value="IN_REPAIR">In Repair</option>
                    </select>
                </div>
                <button type="submit" id="saveButton" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm rounded-lg transition shadow-lg">
                    Add Job Card
                </button>
            </form>
        </div>

        <!-- Right Column: Active Repair Orders List -->
        <div class="lg:col-span-2 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <span>📋</span> Active Workshop Jobs
                </h2>
                <button onclick="loadOrders()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg transition text-slate-300">
                    🔄 Refresh
                </button>
            </div>

            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="py-3 px-4">ID</th>
                            <th class="py-3 px-4">Customer</th>
                            <th class="py-3 px-4">Vehicle</th>
                            <th class="py-3 px-4">Problem</th>
                            <th class="py-3 px-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody" class="text-sm divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="5" class="py-6 text-center text-slate-500">Loading bookings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p id="tableMessage" class="text-xs text-slate-400 mt-4"></p>
        </div>

    </main>

    <!-- JavaScript Functionality -->
    <script>
        const BOOKING_API = "http://localhost:8080/api/bookings";

        async function createRepairOrder(event) {
            event.preventDefault();
            const msgBox = document.getElementById('orderMsg');
            const saveButton = document.getElementById('saveButton');

            const orderData = {
                shopId: parseInt(document.getElementById('shopId').value),
                customerName: document.getElementById('custName').value.trim(),
                vehicleModel: document.getElementById('vehModel').value.trim(),
                problemDescription: document.getElementById('probDesc').value.trim(),
                status: document.getElementById('orderStatus').value
            };

            saveButton.disabled = true;
            saveButton.textContent = "Saving...";

            try {
                const response = await fetch(BOOKING_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(errText || "Failed to save booking");
                }

                msgBox.className = "mb-4 text-xs font-medium text-center text-emerald-400";
                msgBox.innerText = "Job card successfully created!";
                
                document.getElementById('orderForm').reset();
                await loadOrders();
                setTimeout(() => msgBox.innerText = '', 3000);
            } catch (error) {
                console.error(error);
                msgBox.className = "mb-4 text-xs font-medium text-center text-red-400";
                msgBox.innerText = "Error: " + error.message;
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = "Add Job Card";
            }
        }

        async function loadOrders() {
            const tbody = document.getElementById('ordersTableBody');
            const tableMessage = document.getElementById('tableMessage');
            tableMessage.textContent = "Fetching bookings from backend...";

            try {
                const response = await fetch(BOOKING_API);
                if (!response.ok) throw new Error("Server returned HTTP " + response.status);

                const orders = await response.json();
                tbody.innerHTML = '';

                if (!Array.isArray(orders) || orders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-500">No repair orders found.</td></tr>`;
                    tableMessage.textContent = "";
                    return;
                }

                orders.forEach(order => {
                    const row = document.createElement('tr');
                    const status = order.status || "PENDING";
                    const badgeColor = status === 'PENDING' ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 
                                       status === 'IN_REPAIR' ? 'bg-blue-500/20 text-blue-400 border-blue-500/30' : 
                                       'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';

                    row.innerHTML = `
                        <td class="py-3 px-4 text-slate-400">#${order.id ?? ''}</td>
                        <td class="py-3 px-4 font-medium text-white">${order.customerName ?? ''}</td>
                        <td class="py-3 px-4 text-slate-300">${order.vehicleModel ?? ''}</td>
                        <td class="py-3 px-4 text-slate-400 text-xs">${order.problemDescription ?? ''}</td>
                        <td class="py-3 px-4"><span class="px-2.5 py-1 text-xs rounded-full border ${badgeColor}">${status}</span></td>
                    `;
                    tbody.appendChild(row);
                });

                tableMessage.textContent = "Showing " + orders.length + " booking(s).";
            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-red-400">Unable to connect to backend server. Make sure Spring Boot is running on port 8080.</td></tr>`;
                tableMessage.textContent = "";
            }
        }

        document.addEventListener("DOMContentLoaded", loadOrders);
    </script>
</body>
</html>
